        qualite: "Ex-assistants parlementaires (recel)"
        type: personne_physique
    titre: "Affaire dite des « assistants parlementaires du Front National »"
    qualification_legale: "Détournement de fonds publics (art. 432-15 CP), complicité (art. 121-7 CP) et recel / recel habituel par personne morale (art. 321-1, 321-2, 131-38 CP)"
    resume_factuel: "Procédure portant sur l'emploi d'assistants rémunérés sur les crédits du Parlement européen entre 2004 et 2016 (28 contrats retenus en appel ; préjudice évalué à 2,8 M€ pour le Parlement européen, partie civile). Le 7 juillet 2026, la cour d'appel de Paris a confirmé la culpabilité des 12 appelants (avec relaxes partielles sur certaines périodes) tout en aménageant les peines de première instance. 13 pourvois en cassation ont été formés ; le parquet général n'a pas formé de pourvoi."
    juridiction: "Cour d'appel de Paris (pôle 2, ch. 12) — pourvois en cours devant la Cour de cassation"
    dates_cles:
      - date: "2025-03-31"
        libelle: "Jugement du tribunal correctionnel de Paris (25 condamnés, 1 relaxe ; Marine Le Pen condamnée à 4 ans dont 2 fermes, 100 000 € et 5 ans d'inéligibilité avec exécution provisoire)"
      - date: "2025-10-15"
        libelle: "Décision du Conseil d'État confirmant que seule une condamnation définitive met fin au mandat d'un député européen (Nicolas Bay et Catherine Griset)"
      - date: "2026-07-07"
        libelle: "Arrêt de la cour d'appel de Paris (n° RG 25/02203, arrêt n° 26/58) confirmant la culpabilité et aménageant les peines"
      - date: "2026-07-15"
        libelle: "Le parquet général renonce à former un pourvoi en cassation"
      - date: "2026-10-15"
        libelle: "Dépôt des mémoires en cassation (13 pourvois) ; audience sur les QPC annoncée pour le 16/12/2026 (postérieure au 26/11/2026)"
    date_derniere_decision: "2026-07-07"
    peine:
      prison: "Marine Le Pen : 3 ans dont 2 ans avec sursis (1 an ferme aménagé sous détention à domicile sous surveillance électronique). Co-prévenus appelants : de 6 mois à 3 ans avec sursis."
      amende: "Marine Le Pen : 100 000 €. Rassemblement National (personne morale) : 2 000 000 € dont 1 000 000 € avec sursis et confiscation en valeur d'1 000 000 € saisi. Co-prévenus : de 5 000 € à 70 000 €."
      ineligibilite: "Marine Le Pen : 45 mois dont 30 mois avec sursis (les 15 mois fermes jugés déjà exécutés depuis le 31/03/2025). Co-prévenus : de 1 à 2 ans (avec ou sans sursis)."
      execution_provisoire: "Non reconduite en appel ; les 15 mois fermes d'inéligibilité de Marine Le Pen sont considérés par la cour d'appel comme déjà exécutés au titre de l'exécution provisoire du 31/03/2025."
      autres: "Indemnisation du préjudice financier du Parlement européen (2,8 M€ évalués par la cour d'appel)."
      note_recours: "CONDAMNATION NON DÉFINITIVE : 13 pourvois en cassation formés (effet suspensif des peines). Le parquet général n'a pas formé de pourvoi (15/07/2026). Audience QPC prévue le 16/12/2026 (postérieure à la date de référence du 26/11/2026). Présumés innocents."
    references_judiciaires:
      - "CA Paris, pôle 2, ch. 12, 7 juillet 2026, n° RG 25/02203, arrêt n° 26/58"
    confirmation_primaire: confirme
